[build]
  command = "npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/devis"
  to = "/contact#devis"
  status = 301

# Note : la racine "/" et le préfixe de langue (/fr, /en) sur toutes les
# pages sont gérés par middleware.ts, pas par des redirections Netlify
# statiques — ce projet est une app Next.js rendue côté serveur via
# @netlify/plugin-nextjs, pas un SPA avec un index.html.
